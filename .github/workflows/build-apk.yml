name: Build VelvetRain Android APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets into /www
        run: node build.js

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Generate or Verify Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            echo "Generating release keystore..."
            keytool -genkeypair -v -keystore android/app/release.keystore \
              -alias velvetrain \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass VelvetRain2026! \
              -keypass VelvetRain2026! \
              -dname "CN=Pegaxion, OU=Pegaxion, O=Pegaxion, L=Mumbai, ST=Maharashtra, C=IN"
          else
            echo "Release keystore already exists."
          fi

      - name: Build Android App Bundle (AAB) & Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug --stacktrace

      - name: Upload Release AAB (For Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: VelvetRain-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload Release Keystore (Backup for Future Updates)
        uses: actions/upload-artifact@v4
        with:
          name: VelvetRain-Release-Keystore
          path: android/app/release.keystore
          retention-days: 90

      - name: Upload Debug APK (For Direct Phone Testing)
        uses: actions/upload-artifact@v4
        with:
          name: VelvetRain-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
