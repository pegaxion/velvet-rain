<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    background: radial-gradient(circle at 75% 30%, #1e1b4b 0%, #060913 60%, #000000 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #F8FAFC;
    display: flex;
    position: relative;
  }
  .particles {
    position: absolute;
    inset: 0;
    background-image: 
      radial-gradient(2px 2px at 100px 80px, rgba(99, 102, 241, 0.4), transparent),
      radial-gradient(2px 2px at 250px 320px, rgba(56, 189, 248, 0.5), transparent),
      radial-gradient(3px 3px at 450px 120px, rgba(99, 102, 241, 0.6), transparent),
      radial-gradient(2px 2px at 700px 220px, rgba(56, 189, 248, 0.4), transparent),
      radial-gradient(3px 3px at 880px 90px, rgba(168, 85, 247, 0.5), transparent),
      radial-gradient(2px 2px at 920px 420px, rgba(56, 189, 248, 0.3), transparent);
  }
  .left {
    flex: 1.1;
    padding: 60px 0 60px 60px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    z-index: 2;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(99, 102, 241, 0.15);
    border: 1px solid rgba(99, 102, 241, 0.4);
    color: #818CF8;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    width: fit-content;
    margin-bottom: 20px;
    letter-spacing: 0.5px;
  }
  h1 {
    font-size: 54px;
    font-weight: 800;
    letter-spacing: -1.5px;
    line-height: 1.05;
    background: linear-gradient(135deg, #FFFFFF 40%, #A5B4FC 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
  }
  .tagline {
    font-size: 20px;
    color: #94A3B8;
    font-weight: 500;
    margin-bottom: 28px;
  }
  .features {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .pill {
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 13px;
    color: #E2E8F0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .right {
    flex: 0.9;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .icon-preview {
    width: 220px;
    height: 220px;
    border-radius: 46px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 50px rgba(99, 102, 241, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.15);
  }
  .by-pegaxion {
    position: absolute;
    bottom: 24px;
    right: 40px;
    font-size: 12px;
    color: #64748B;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="particles"></div>
  <div class="left">
    <div class="badge">🌧️ AMBIENT SLEEP SANCTUARY</div>
    <h1>VelvetRain</h1>
    <div class="tagline">Restful Sleep & Focus Mixer</div>
    <div class="features">
      <div class="pill"><span>✨</span> Zero Loop Clicks</div>
      <div class="pill"><span>🚫</span> No Interruptive Ads</div>
      <div class="pill"><span>⏳</span> 5-Min Sleep Fade</div>
      <div class="pill"><span>🖤</span> True OLED Black</div>
      <div class="pill"><span>🫁</span> 4-7-8 Breathing</div>
      <div class="pill"><span>✈️</span> 100% Offline</div>
    </div>
  </div>
  <div class="right">
    <img src="../icon-512.png" class="icon-preview" alt="VelvetRain">
    <div class="by-pegaxion">BY PEGAXION</div>
  </div>
</body>
</html>
